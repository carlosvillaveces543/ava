  function normalizeSectionOrder(order=[]){
    const valid=new Set(defaultSections),seen=new Set(),normalized=[];
    for(const id of Array.isArray(order)?order:[]){if(valid.has(id)&&!seen.has(id)){seen.add(id);normalized.push(id)}}
    for(const id of defaultSections){if(!seen.has(id)){seen.add(id);normalized.push(id)}}
    return normalized
  }
  function profileSectionOrder(profile=state.profile){
    const saved=Array.isArray(profile?.sectionOrder)&&profile.sectionOrder.length?profile.sectionOrder:(profile?.sections||[]);return normalizeSectionOrder(saved)
  }
  function visibleSectionOrder(profile=state.profile){
    const ordered=profileSectionOrder(profile);if(profile?.rol==='admin')return ordered;const allowed=new Set(profile?.sections||[]);return ordered.filter(id=>allowed.has(id))
  }
  function sectionSorterMarkup(id,checked=true){
    return `<div class="drag-item section-sort-item" data-section-id="${id}"><button class="section-drag-handle" type="button" data-section-drag-handle aria-label="Mover ${escapeHtml(menuMap[id][1])}" title="Arrastrar para reordenar"><i data-lucide="grip-vertical"></i></button><label><input type="checkbox" value="${id}" ${checked?'checked':''}><span>${escapeHtml(menuMap[id][1])}</span></label></div>`
  }
  function enableSectionSorting(root,order,onOrderChange=()=>{}){
    if(!root)return;root.classList.add('section-sort-list');let active=null;
    const syncOrder=()=>{const next=$$('[data-section-id]',root).map(el=>el.dataset.sectionId);order.splice(0,order.length,...next);onOrderChange([...next])};
    const scrollHost=()=>root.closest('.modal')||document.scrollingElement;
    const autoScroll=clientY=>{const host=scrollHost(),edge=56,speed=18;if(host===document.scrollingElement){if(clientY<edge)window.scrollBy(0,-speed);else if(clientY>window.innerHeight-edge)window.scrollBy(0,speed);return}const rect=host.getBoundingClientRect();if(clientY<rect.top+edge)host.scrollTop-=speed;else if(clientY>rect.bottom-edge)host.scrollTop+=speed};
    const move=e=>{
      if(!active||e.pointerId!==active.pointerId)return;e.preventDefault();active.item.style.top=`${e.clientY-active.offsetY}px`;
      const candidates=$$('[data-section-id]',root).filter(el=>el!==active.item);const before=candidates.find(el=>{const r=el.getBoundingClientRect();return e.clientY<r.top+r.height/2});
      if(before)root.insertBefore(active.placeholder,before);else root.appendChild(active.placeholder);autoScroll(e.clientY)
    };
    const finish=e=>{
      if(!active||e.pointerId!==active.pointerId)return;const {item,placeholder,handle,pointerId}=active;active=null;
      try{handle.releasePointerCapture?.(pointerId)}catch{}root.insertBefore(item,placeholder);placeholder.remove();item.classList.remove('section-sort-dragging');item.removeAttribute('style');document.body.classList.remove('section-sorting');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',finish);document.removeEventListener('pointercancel',finish);syncOrder()
    };
    $$('[data-section-drag-handle]',root).forEach(handle=>{
      handle.addEventListener('pointerdown',e=>{
        if(active||(e.pointerType==='mouse'&&e.button!==0))return;const item=handle.closest('[data-section-id]');if(!item)return;e.preventDefault();
        const rect=item.getBoundingClientRect(),placeholder=document.createElement('div');placeholder.className='section-drag-placeholder';placeholder.style.height=`${rect.height}px`;root.insertBefore(placeholder,item);
        active={item,placeholder,handle,pointerId:e.pointerId,offsetY:e.clientY-rect.top};item.classList.add('section-sort-dragging');Object.assign(item.style,{position:'fixed',left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`,margin:'0',zIndex:'210',pointerEvents:'none'});document.body.classList.add('section-sorting');
        try{handle.setPointerCapture?.(e.pointerId)}catch{}document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',finish)
      });
      handle.addEventListener('keydown',e=>{
        if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const item=handle.closest('[data-section-id]'),sibling=e.key==='ArrowUp'?item.previousElementSibling:item.nextElementSibling;if(!sibling||!sibling.matches('[data-section-id]'))return;if(e.key==='ArrowUp')root.insertBefore(item,sibling);else root.insertBefore(sibling,item);syncOrder();handle.focus()
      })
    })
  }

    function publicCounterAdvanced(orderId) {
      return existsAfter(/databases/$(database)/documents/counters/main_catalogOrder)
        && getAfter(/databases/$(database)/documents/counters/main_catalogOrder).data.value
          == (exists(/databases/$(database)/documents/counters/main_catalogOrder)
            ? get(/databases/$(database)/documents/counters/main_catalogOrder).data.value
            : 0) + 1
        && getAfter(/databases/$(database)/documents/counters/main_catalogOrder).data.lastOrderId == orderId;
    }
    function publicOrderFields(orderId) {
      return request.resource.data.keys().hasOnly([
          'negocioId','createdAt','createdBy','sequence','number','customer','items','status',
          'subtotal','delivery','prep','discount','total','coupon','paymentMethod',
          'deliveryType','date','history'
        ])
        && request.resource.data.negocioId == 'main'
        && request.resource.data.sequence is int
        && request.resource.data.sequence > 0
        && request.resource.data.sequence == getAfter(/databases/$(database)/documents/counters/main_catalogOrder).data.value
        && request.resource.data.number is string
        && request.resource.data.number.matches('^P-[0-9]{6,}$')
        && request.resource.data.customer is map
        && request.resource.data.items is list
        && request.resource.data.items.size() > 0
        && request.resource.data.items.size() <= 100
        && publicCounterAdvanced(orderId);
    }
    function publicCounterCreateIsValid() {
      return catalogOpen()
        && request.resource.data.keys().hasOnly(['negocioId','value','lastOrderId','updatedAt'])
        && request.resource.data.negocioId == 'main'
        && request.resource.data.value == 1
        && request.resource.data.lastOrderId is string
        && existsAfter(/databases/$(database)/documents/catalogOrders/$(request.resource.data.lastOrderId))
        && getAfter(/databases/$(database)/documents/catalogOrders/$(request.resource.data.lastOrderId)).data.sequence == 1;
    }
    function publicCounterUpdateIsValid() {
      return catalogOpen()
        && resource.data.negocioId == 'main'
        && request.resource.data.negocioId == 'main'
        && request.resource.data.keys().hasOnly(['negocioId','value','lastOrderId','updatedAt'])
        && request.resource.data.diff(resource.data).changedKeys().hasOnly(['value','lastOrderId','updatedAt'])
        && request.resource.data.value == resource.data.value + 1
        && request.resource.data.lastOrderId is string
        && existsAfter(/databases/$(database)/documents/catalogOrders/$(request.resource.data.lastOrderId))
        && getAfter(/databases/$(database)/documents/catalogOrders/$(request.resource.data.lastOrderId)).data.sequence == request.resource.data.value;
    }
    function publicCustomerFields() {
      return request.resource.data.keys().hasOnly([
        'negocioId','name','phone','address','city','zone','deliveryDate','notes','status','date'
      ]) && request.resource.data.negocioId == 'main';
    }

    match /users/{uid} {
      // Ventana de bootstrap: solo antes de que exista config/main.
      allow create: if signedIn() && request.auth.uid == uid
        && !exists(/databases/$(database)/documents/config/main)
        && request.resource.data.negocioId == 'main'
        && request.resource.data.rol == 'admin';
      allow read: if signedIn() && (request.auth.uid == uid || admin());
      allow update, delete: if admin();
    }

    match /config/{businessId} {
      allow read: if sameBusiness(businessId);
      allow write: if admin() && profile().negocioId == businessId;
    }
    match /publicConfig/{businessId} {
      allow read: if businessId == 'main';
      allow write: if admin() && profile().negocioId == businessId;
    }
    match /catalog/{productId} {
      // La colección catalog es el espejo público y no contiene costos ni recetas internas.
      allow read: if true;
      allow write: if admin() && request.resource.data.negocioId == profile().negocioId;
      allow delete: if admin() && resource.data.negocioId == profile().negocioId;
    }
    match /catalogOrders/{orderId} {
      allow create: if catalogOpen() && publicOrderFields(orderId);
      allow read, update, delete: if can('catalog-orders') && isBusinessDoc();
    }
    match /customers/{customerId} {
      allow create: if publicCustomerFields();
      allow read: if (can('customers') || can('invoice') || can('catalog-orders')) && isBusinessDoc();
      allow update, delete: if can('customers') && isBusinessDoc();
    }
    match /providers/{id} {
      allow read: if (can('configuration') || can('purchase-entry') || can('purchase-orders') || can('create-purchase-order')) && isBusinessDoc();
      allow write: if admin() && isBusinessDoc();
    }
    match /purchases/{id} {
      allow read: if (can('purchase-entry') || can('purchase-history') || can('dashboard') || can('inventory')) && isBusinessDoc();
      allow create, update: if can('purchase-entry') && isBusinessDoc();
      allow delete: if (can('purchase-history') || admin()) && isBusinessDoc();
    }
    match /inventory/{id} {
      allow read: if (can('inventory') || can('product-create') || can('create-purchase-order') || can('dashboard')) && isBusinessDoc();
      allow write: if (can('inventory') || can('purchase-entry') || can('invoice') || can('commands') || can('catalog-orders') || can('product-create')) && isBusinessDoc();
    }
    match /inventoryMovements/{id} {
      allow read: if (can('kardex') || can('dashboard')) && isBusinessDoc();
      allow create: if active() && isBusinessDoc();
      allow update, delete: if admin() && isBusinessDoc();
    }
    match /products/{id} {
      allow read: if active() && isBusinessDoc();
      allow create, update: if (can('product-create') || can('products') || can('margins') || can('catalog-images') || can('purchase-entry')) && isBusinessDoc();
      allow delete: if (can('products') || admin()) && isBusinessDoc();
    }
    match /expenses/{id} {
      allow read: if (can('expense-entry') || can('expense-history') || can('dashboard')) && isBusinessDoc();
      allow create: if can('expense-entry') && isBusinessDoc();
      allow update, delete: if (can('expense-history') || admin()) && isBusinessDoc();
    }
    match /invoices/{id} {
      allow read: if (can('invoice') || can('commands') || can('sales') || can('pending-invoices') || can('dashboard') || can('day') || can('customers')) && isBusinessDoc();
      allow create, update: if (can('invoice') || can('commands') || can('catalog-orders')) && isBusinessDoc();
      allow delete: if (can('sales') || can('pending-invoices') || admin()) && isBusinessDoc();
    }
    match /purchaseOrders/{id} {
      allow read: if (can('purchase-orders') || can('create-purchase-order') || can('purchase-entry')) && isBusinessDoc();
      allow create, update: if (can('purchase-orders') || can('create-purchase-order') || can('purchase-entry')) && isBusinessDoc();
      allow delete: if (can('purchase-orders') || admin()) && isBusinessDoc();
    }
    match /dailyTasks/{id} {
      allow read: if (can('tasks') || can('day') || can('dashboard')) && isBusinessDoc();
      allow create, delete: if can('tasks') && isBusinessDoc();
      allow update: if (can('tasks') || can('day')) && isBusinessDoc();
    }
    match /goals/{id} {
      allow read: if (can('goals') || can('dashboard') || can('day')) && isBusinessDoc();
      allow write: if (can('goals') || can('dashboard')) && isBusinessDoc();
    }
    match /cashRegister/{id} {
      allow read, write: if can('day') && isBusinessDoc();
    }
    match /counters/{id} {
      // El contador público solo admite incrementos de +1 ligados al pedido creado en la misma transacción.
      allow get: if id == 'main_catalogOrder';
      allow create: if id == 'main_catalogOrder' && publicCounterCreateIsValid();
      allow update: if id == 'main_catalogOrder' && publicCounterUpdateIsValid();
      allow read, write: if active() && isBusinessDoc();
    }
    match /{document=**} { allow read, write: if false; }
  }
}`;
  // FIN CAMBIO - puntos 3 y 5

  const STORAGE_RULES=`rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    function signedIn() { return request.auth != null; }
    function profile() {
      return firestore.get(/databases/(default)/documents/users/$(request.auth.uid)).data;
    }
    function active() { return signedIn() && profile().activo == true; }
    function canUpload(businessId) {
      return active() && profile().negocioId == businessId
        && (profile().rol == 'admin' || profile().sections.hasAny(['configuration','catalog-images','product-create','products']));
    }
    function validImage() {
      return request.resource == null || (
        request.resource.size < 6 * 1024 * 1024
        && request.resource.contentType.matches('image/.*')
      );
    }
    match /{businessId}/{allPaths=**} {
      allow read: if businessId == 'main';
      allow create, update: if canUpload(businessId) && validImage();
      allow delete: if canUpload(businessId);
    }
  }
}`;

  // Exponer reglas en consola facilita copiarlas incluso si Configuración aún no carga.
  window.AVA_SECURITY_RULES={firestore:FIRESTORE_RULES,storage:STORAGE_RULES};
  iconRefresh();
  </script>
</body>
