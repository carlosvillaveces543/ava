    $('#guestCompanionsPanel').classList.toggle('hidden',!enabled);
    if(enabled&&!$$('.companion-row',companionsList).length)addCompanionRow();
  });
  $('#addGuestCompanion').addEventListener('click',()=>addCompanionRow());

  const getSelectedService=()=>services.find(s=>s.id===$('#guestService').value);
  const updateRoomVisibility=()=>{
    const service=getSelectedService();
    const requiresRoom=!service||service.requiereHabitacion!==false;
    $('#guestRoomField').classList.toggle('hidden',!!service&&!requiresRoom);
    if(service&&!requiresRoom)$('#guestRoom').value='';
  };
  const calc=()=>{
    const total=parseMoney($('#guestValue').value);
    const count=Math.floor(safeNumber($('#guestCount').value));
    $('#guestUnitValue').value=count>0?money(total/count):money(0);
    const received1=$('#guestReceived1').value===''?0:safeNumber($('#guestReceived1').value);
    const received2=$('#guestSplit').checked?safeNumber($('#guestReceived2').value):0;
    const diff=received1+received2-total;
    $('#guestChange').value=diff>=0?`Devuelve ${money(diff)}`:`Pendiente ${money(Math.abs(diff))}`;
    updateRoomVisibility();
  };
  const applyCalendarArrivalDraft=()=>{
    if(!calendarArrivalDraft)return;
    const draft=calendarArrivalDraft;
    if(draft.serviceId&&!services.some(s=>s.id===draft.serviceId))return;
    if(draft.roomId&&!rooms.some(r=>r.id===draft.roomId))return;
    $('#guestName').value=draft.clienteNombre||'';
    $('#guestCedula').value=draft.cedula||'';
    $('#guestPhone').value=draft.telefono||'';
    $('#guestCount').value=Math.max(1,safeNumber(draft.cantidadPersonas)||1);
    if(draft.serviceId)$('#guestService').value=draft.serviceId;
    const draftService=services.find(service=>service.id===draft.serviceId);
    $('#guestValue').value=draft.valorTotal!==undefined?safeNumber(draft.valorTotal):(draftService?safeNumber(draftService.valor):'');
    $('#guestReceived1').value=safeNumber(draft.abono)>0?safeNumber(draft.abono):'';
    calendarArrivalReservationId=draft.reservationId||null;
    if(draft.roomId)$('#guestRoom').value=draft.roomId;
    selectedClient=clients.find(c=>c.cedula&&c.cedula===draft.cedula)||null;
    calendarArrivalDraft=null;
    calc();
  };
  const updateSelects=()=>{
    const currentService=$('#guestService').value;
    const currentRoom=$('#guestRoom').value;
    $('#guestService').innerHTML='<option value="">Selecciona...</option>'+services.map(service=>`<option value="${service.id}">${escapeHtml(service.descripcion)}</option>`).join('');
    $('#guestRoom').innerHTML='<option value="">Selecciona...</option>'+rooms.filter(room=>room.estado!=='ocupada').map(room=>`<option value="${room.id}">${escapeHtml(room.nombre)}</option>`).join('');
    if(services.some(service=>service.id===currentService))$('#guestService').value=currentService;
    if(rooms.some(room=>room.id===currentRoom&&room.estado!=='ocupada'))$('#guestRoom').value=currentRoom;
    updateRoomVisibility();
    applyCalendarArrivalDraft();
  };

  $('#guestService').addEventListener('change',()=>{
    const service=getSelectedService();
    $('#guestValue').value=service?safeNumber(service.valor):'';
    calc();
  });
  ['guestValue','guestCount','guestReceived1','guestReceived2'].forEach(id=>$('#'+id).addEventListener('input',calc));
  $('#guestSplit').addEventListener('change',()=>{$$('.split-guest').forEach(el=>el.classList.toggle('hidden',!$('#guestSplit').checked));calc();});
  bindAutocomplete($('#guestName'),$('#guestSuggest'),()=>clients,x=>x.nombre||'',client=>{
    selectedClient=client;$('#guestName').value=client.nombre;$('#guestCedula').value=client.cedula||'';$('#guestPhone').value=client.celular||'';
  });

  $('#saveGuest').addEventListener('click',async()=>{
    const service=getSelectedService();
    const requiresRoom=service?service.requiereHabitacion!==false:true;
    const room=requiresRoom?rooms.find(r=>r.id===$('#guestRoom').value):null;
    const clienteNombre=$('#guestName').value.trim();
    const cedula=$('#guestCedula').value.trim();
    const telefono=$('#guestPhone').value.trim();
    const cantidadHuespedes=Math.floor(safeNumber($('#guestCount').value));
    const total=parseMoney($('#guestValue').value);
    if(!clienteNombre||!service||(requiresRoom&&!room)||cantidadHuespedes<1||total<=0){
      toast(requiresRoom?'Completa cliente, servicio, habitación, total y cantidad de huéspedes.':'Completa cliente, servicio, total y cantidad de huéspedes.','error');return;
    }
    const companionData=collectCompanions();
    const acompanantes=companionData.acompanantes;
    try{
      const amount1=$('#guestReceived1').value===''?0:safeNumber($('#guestReceived1').value);
      const splitPayment=$('#guestSplit').checked;
      const amount2=splitPayment?safeNumber($('#guestReceived2').value):0;
      if(amount1<0||amount2<0){toast('Los montos recibidos no pueden ser negativos.','error');return;}
      const received=amount1+amount2;
      const paid=Math.min(received,total);
      const debt=Math.max(total-received,0);
      const exit=requiresRoom?calculateExitDate(service,new Date()):null;
      if(requiresRoom&&!exit)throw new Error('No fue posible calcular la hora de salida del servicio seleccionado.');
      const batch=db.batch();
      const registroRef=db.collection('registros').doc();
      // Se mantiene la estructura original del registro. La forma de pago se completa exclusivamente en nuevo_pagos.
      batch.set(registroRef,{
        clienteNombre,clienteId:selectedClient?.id||null,cedula,acompanantes,
        servicioId:service.id,servicioDescripcion:service.descripcion,
        requiereHabitacion:requiresRoom,habitacionId:requiresRoom?room.id:null,habitacionNombre:requiresRoom?room.nombre:null,
        valorTotal:total,valorPagado:paid,valor:paid,saldoPendiente:debt,
        formaPago:'',pagoDividido:false,pagos:[],
        fecha:serverNow(),createdAt:serverNow(),origen:requiresRoom?'hospedaje':'servicio',creadoPor:currentUser.email
      });
      const detailRef=db.collection(NEW_COLLECTIONS.guestDetails).doc(registroRef.id);
      const guestDetailData={
        registroId:registroRef.id,cantidadHuespedes,totalServicio:total,
        valorUnitarioPersona:cantidadHuespedes>0?total/cantidadHuespedes:0,
        telefono,reservaId:calendarArrivalReservationId||null,createdAt:serverNow(),updatedAt:serverNow()
      };
      const paymentRef=db.collection(NEW_COLLECTIONS.payments).doc(paymentDocId('registro',registroRef.id));
      const pendingMeta={
        tipoRegistro:'registro',registroId:registroRef.id,estado:'pendiente',formaPago:'',pagoDividido:splitPayment,pagos:[],
        montoRecibido:received,montoPrimero:amount1,montoSegundo:amount2,saldoPendiente:debt,
        createdAt:serverNow(),updatedAt:serverNow()
      };
      if(debt>0||received<=0){
        const debtRef=db.collection('cartera').doc();
        batch.set(debtRef,{
          clienteNombre,clienteId:selectedClient?.id||null,cedula,descripcion:service.descripcion,
          valorPendiente:debt>0?debt:total,valorOriginal:total,origen:requiresRoom?'hospedaje':'servicio',servicioId:service.id,
          requiereHabitacion:requiresRoom,habitacionId:requiresRoom?room.id:null,habitacionNombre:requiresRoom?room.nombre:null,
          fecha:serverNow(),createdAt:serverNow()
        });
      }
      if(requiresRoom){
        const roomRef=db.collection('habitaciones').doc(room.id);
        batch.set(roomRef,{
          estado:'ocupada',updatedAt:serverNow(),
          estadiaActiva:{
            clienteNombre,clienteId:selectedClient?.id||null,cedula,servicioId:service.id,acompanantes,
            servicioDescripcion:service.descripcion,valor:total,checkIn:serverNow(),expiresAt:firebase.firestore.Timestamp.fromDate(exit),
            tipoTiempo:service.tipoTiempo,horas:service.horas||null,horaSalida:service.horaSalida||null,registroId:registroRef.id
          }
        },{merge:true});
      }
      await batch.commit();
      const arrivedReservationId=calendarArrivalReservationId;
      let paymentSaved=true;
      let detailsSaved=true;
      let reservationSaved=true;
      try { await detailRef.set(guestDetailData,{merge:true}); } catch(detailError) { detailsSaved=false; console.error('Registro guardado, pero faltan detalles de huéspedes.',detailError); }
      try { await paymentRef.set(pendingMeta,{merge:true}); } catch(paymentError) { paymentSaved=false; console.error('Registro guardado, pero no se pudo crear el pago pendiente.',paymentError); }
      if(arrivedReservationId){
        try { await db.collection(NEW_COLLECTIONS.reservations).doc(arrivedReservationId).set({estado:'registrada',llegadaRegistroId:registroRef.id,registradaAt:serverNow(),updatedAt:serverNow()},{merge:true}); }
        catch(reservationError) { reservationSaved=false; console.error('No se pudo actualizar el estado de la reserva.',reservationError); }
      }
      const writeWarnings=[];
      if(!detailsSaved)writeWarnings.push('cantidad/teléfono');
      if(!paymentSaved)writeWarnings.push('pago pendiente');
      if(!reservationSaved)writeWarnings.push('estado de reserva');
      toast(writeWarnings.length?`Registro guardado, pero no se pudo guardar: ${writeWarnings.join(', ')}. Revisa los permisos de Firestore.`:(requiresRoom?'Registro guardado y habitación ocupada':'Servicio registrado sin habitación'),writeWarnings.length?'error':'success');
      calendarArrivalReservationId=null;
      const paymentOptions={
        type:'registro',recordId:registroRef.id,total,amount1,amount2,split:splitPayment,
        clientName:clienteNombre,documentNumber:registroRef.id,dateLabel:localDateTime(new Date()),
        serviceDescription:service.descripcion,roomName:requiresRoom?room.nombre:'',cedula,phone:telefono,
        guestCount:cantidadHuespedes,balance:debt,notes:'',existingMeta:pendingMeta,persistenceWarning:!paymentSaved
      };
      selectedClient=null;
      $('#guestName').value='';$('#guestCedula').value='';$('#guestPhone').value='';$('#guestService').value='';$('#guestRoom').value='';
      $('#guestValue').value='';$('#guestCount').value='1';$('#guestReceived1').value='';$('#guestReceived2').value='';$('#guestSplit').checked=false;
      $$('.split-guest').forEach(el=>el.classList.add('hidden'));
      $('#guestHasCompanions').checked=false;$('#guestCompanionsPanel').classList.add('hidden');companionsList.innerHTML='';companionCounter=0;
      calc();
      openPaymentModal(paymentOptions);
    }catch(err){showError(err,'No fue posible guardar el registro');}
  });

  addUnsub(db.collection('clientes').onSnapshot(snap=>{clients=snap.docs.map(doc=>({id:doc.id,...doc.data()}));applyCalendarArrivalDraft();}));
  addUnsub(db.collection('servicios').onSnapshot(snap=>{services=snap.docs.map(doc=>({id:doc.id,...doc.data()}));updateSelects();calc();}));
  addUnsub(db.collection('habitaciones').onSnapshot(snap=>{rooms=snap.docs.map(doc=>({id:doc.id,...doc.data()}));updateSelects();}));
  updateSelects();
}

async function registerDebtPayment(debt, amount, method) {
  const pay = Math.min(safeNumber(amount), safeNumber(debt.valorPendiente));
  if (pay <= 0) throw new Error('El valor del abono debe ser mayor a cero.');
  const batch = db.batch();
  const debtRef = db.collection('cartera').doc(debt.id);
  const remaining = safeNumber(debt.valorPendiente) - pay;
  if (debt.origen === 'facturacion') {
    const saleRef = db.collection('ventas').doc();
    batch.set(saleRef, {
      tipo:'abono', isAbono:true, facturaNumero: debt.facturaNumero || null,
      clienteNombre: debt.clienteNombre, clienteId: debt.clienteId || null, cedula: debt.cedula || '',
      descripcion: `Abono cartera: ${debt.descripcion || ''}`,
      totalFactura: pay, totalPagado: pay, valor: pay, formaPago: method,
      pagos:[{ metodo: method, monto: pay }], fecha: serverNow(), createdAt: serverNow(), origen:'abono-cartera', creadoPor: currentUser.email
    });
  } else {
    const regRef = db.collection('registros').doc();
    batch.set(regRef, {
      tipo:'abono', isAbono:true, clienteNombre: debt.clienteNombre, clienteId: debt.clienteId || null, cedula: debt.cedula || '',
      descripcion: `Abono cartera: ${debt.descripcion || ''}`, servicioDescripcion: debt.descripcion || 'Abono hospedaje',
      habitacionId: debt.habitacionId || null, habitacionNombre: debt.habitacionNombre || null,
      valorTotal: pay, valorPagado: pay, valor: pay, formaPago: method,
      pagos:[{ metodo: method, monto: pay }], fecha: serverNow(), createdAt: serverNow(), origen:'abono-cartera', creadoPor: currentUser.email
    });
  }
  if (remaining <= 0.0001) batch.delete(debtRef);
  else batch.set(debtRef, { valorPendiente: remaining, updatedAt: serverNow() }, {merge:true});
  await batch.commit();
}

function renderCartera() {
  let debts = [];
  let clients = [];
  setContent(`
    ${sectionIntro('Cartera', 'Saldos pendientes originados en facturación o hospedaje.')}
    <div class="card">
      <div class="toolbar">
        <div class="field" style="min-width:min(100%,360px)">
          <label>Buscar en cartera</label>
          <input id="walletSearch" type="search" placeholder="Buscar por nombre, apellido o cédula..." autocomplete="off" />
        </div>
      </div>
      <div id="walletTable"></div>
    </div>
  `);

  const getDebtCedula = debt => {
    if (debt.cedula) return debt.cedula;
    const client = clients.find(c => c.id === debt.clienteId);
    return client?.cedula || '';
  };

  // MEJORA 3: búsqueda por apellido y por nombre/apellido en cualquier orden.
  const render = () => {
    const searchTerms = normalizeSearchText($('#walletSearch')?.value || '')
      .split(/\s+/)
      .filter(Boolean);

    const filtered = debts.filter(d => {
      const cedula = getDebtCedula(d);
      const haystack = normalizeSearchText(`${d.clienteNombre || ''} ${cedula}`);
      return !searchTerms.length || searchTerms.every(term => haystack.includes(term));
    });
    const total = filtered.reduce((s,d)=>s+safeNumber(d.valorPendiente),0);

    if (!filtered.length) {
      $('#walletTable').innerHTML = `<div class="totalizer"><span>Total pendiente</span><strong>${money(0)}</strong></div>${emptyState(debts.length ? 'No hay deudas que coincidan con la búsqueda.' : 'No hay deudas pendientes.')}`;
      initIcons();
      return;
    }

    $('#walletTable').innerHTML = `<div class="totalizer"><span>Total pendiente</span><strong>${money(total)}</strong></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Cédula</th><th>Descripción</th><th>Origen</th><th>Valor pendiente</th><th>Fecha origen</th><th></th></tr></thead><tbody>
      ${filtered.map(d=>`<tr><td><b>${escapeHtml(d.clienteNombre)}</b></td><td>${escapeHtml(getDebtCedula(d) || '-')}</td><td>${escapeHtml(d.descripcion)}</td><td><span class="pill">${escapeHtml(d.origen)}</span></td><td class="amount">${money(d.valorPendiente)}</td><td>${localDateTime(getDocDate(d)||new Date())}</td><td style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" data-pay-debt="${d.id}" type="button"><i data-lucide="badge-dollar-sign"></i> Abonar</button><button class="btn btn-success btn-sm" data-settle-debt="${d.id}" type="button"><i data-lucide="check-check"></i> Saldar</button><button class="btn btn-danger btn-sm" data-delete-debt="${d.id}" type="button"><i data-lucide="trash-2"></i> Eliminar deuda</button></td></tr>`).join('')}
    </tbody></table></div>`;
    $$('[data-pay-debt]').forEach(btn => btn.addEventListener('click', async () => {
      const d = debts.find(x => x.id === btn.dataset.payDebt); if (!d) return;
      const val = prompt(`Valor del abono para ${d.clienteNombre}:`, ''); if (val === null) return;
      const method = prompt('Forma de pago (Efectivo, Nequi, Transferencia, Tarjeta):', 'Efectivo') || 'Efectivo';
      try { await registerDebtPayment(d, safeNumber(val), method); toast('Abono registrado'); }
      catch(err) { showError(err, 'No fue posible registrar abono'); }
    }));
    $$('[data-settle-debt]').forEach(btn => btn.addEventListener('click', async () => {
      const d = debts.find(x => x.id === btn.dataset.settleDebt); if (!d) return;
      const method = prompt('Forma de pago para saldar:', 'Efectivo') || 'Efectivo';
      try { await registerDebtPayment(d, safeNumber(d.valorPendiente), method); toast('Deuda saldada'); }
      catch(err) { showError(err, 'No fue posible saldar'); }
    }));
    $$('[data-delete-debt]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirmPassword()) { toast('Contraseña incorrecta.', 'error'); return; }
      try { await db.collection('cartera').doc(btn.dataset.deleteDebt).delete(); toast('Deuda eliminada sin generar ingreso'); }
      catch(err) { showError(err, 'No fue posible eliminar'); }
    }));
    initIcons();
  };

  $('#walletSearch').addEventListener('input', render);
  addUnsub(db.collection('clientes').onSnapshot(snap => { clients = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('cartera').orderBy('createdAt','desc').onSnapshot(snap => { debts = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
}

function renderDashboard() {
  let ventas = [], compras = [], gastos = [], registros = [], inventario = [], metaDoc = { valor: 0 }, paymentMap = {};
  setContent(`
    ${sectionIntro('Dashboard', 'Indicadores comerciales, hoteleros e inventario valorizado.')}
    <div class="card" style="margin-bottom:16px">${renderDateToolbar('dashboard')}
      <div class="form-grid two">
        <div class="field"><label>Meta del mes ($)</label><input id="monthlyGoal" type="number" min="0" step="0.01" placeholder="Ej. 15000000" /></div>
        <div class="field"><label>Progreso</label><div class="progress"><span id="goalProgress"></span></div><p id="goalText" class="mini"></p></div>
      </div>
    </div>
    <div id="dashboardRoot"></div>
  `);

  const saveGoal = async () => {
    try { await db.collection('ajustes').doc('dashboard').set({ metaMensual: safeNumber($('#monthlyGoal').value), updatedAt: serverNow() }, {merge:true}); }
    catch(err) { showError(err, 'No fue posible guardar la meta'); }
  };
  $('#monthlyGoal').addEventListener('blur', saveGoal);

  function sumPaymentsByMethod(records) {
    const salesRecords = records.filter(record => record.facturaId !== undefined);
    const guestRecords = records.filter(record => record.facturaId === undefined);
    const salesMap = aggregatePaymentsByMethod(salesRecords, paymentMap, 'ventas');
    const guestMap = aggregatePaymentsByMethod(guestRecords, paymentMap, 'registros');
    const combined = { ...salesMap };
    Object.entries(guestMap).forEach(([method,value]) => combined[method] = (combined[method] || 0) + value);
    return combined;
  }

  function renderCharts(barValues, paymentMap, projection, goal) {
    Object.values(chartInstances).forEach(ch => { try { ch.destroy(); } catch(e){} });
    chartInstances = {};
    const barCtx = $('#barChart');
    const doughnutCtx = $('#paymentChart');
    const lineCtx = $('#projectionChart');
    if (barCtx) chartInstances.bar = new Chart(barCtx, { type:'bar', data:{ labels:['Ventas','Compras','Gastos'], datasets:[{ label:'Valor', data:barValues }] }, options:{ responsive:true, plugins:{ legend:{display:false} } } });
    if (doughnutCtx) chartInstances.pay = new Chart(doughnutCtx, { type:'doughnut', data:{ labels:Object.keys(paymentMap), datasets:[{ data:Object.values(paymentMap) }] }, options:{ responsive:true } });
    if (lineCtx) chartInstances.line = new Chart(lineCtx, { type:'line', data:{ labels:['Actual','Proyección','Meta'], datasets:[{ label:'Proyección vs Meta', data:[barValues[0], projection, goal], tension:.35 }] }, options:{ responsive:true } });
  }

  const render = () => {
    const start = $('#filterStart').value;
    const end = $('#filterEnd').value;
    const ventasF = ventas.filter(v => inDateRange(v,start,end));
    const comprasF = compras.filter(c => inDateRange(c,start,end));
    const gastosF = gastos.filter(g => inDateRange(g,start,end));
    const registrosF = registros.filter(r => inDateRange(r,start,end));

    const totalVentas = ventasF.reduce((s,v)=>s+safeNumber(v.valor || v.totalPagado),0);
    const totalCompras = comprasF.reduce((s,c)=>s+safeNumber(c.valorTotal),0);
    const totalGastos = gastosF.reduce((s,g)=>s+safeNumber(g.valor),0);
    // [MEJORA #3 - INICIO]
    const ingresosServicios = registrosF.reduce((s,r)=>s+safeNumber(r.valor || r.valorPagado),0);
    const utilidad = ingresosServicios + totalVentas - totalCompras - totalGastos;
    const goal = safeNumber(metaDoc.metaMensual || metaDoc.valor || 0);
    const goalBase = ingresosServicios + totalVentas;
    // [MEJORA #3 - FIN]
    const pctGoal = goal > 0 ? Math.min((goalBase / goal) * 100, 999) : 0;
    $('#monthlyGoal').value = goal || '';
    $('#goalProgress').style.width = Math.min(pctGoal,100).toFixed(2) + '%';
    $('#goalText').textContent = goal > 0 ? `${pctGoal.toFixed(2)}% alcanzado · ${money(goalBase)} de ${money(goal)}` : 'Ingresa una meta para visualizar el progreso.';

    const units = ventasF.filter(v=>!v.isAbono).flatMap(v=>v.items || []).reduce((s,it)=>s+safeNumber(it.cantidad),0);
    const invoices = new Set(ventasF.filter(v=>v.facturaNumero).map(v=>v.facturaNumero)).size || ventasF.length;
    const upt = invoices ? units / invoices : 0;
    const vpt = invoices ? totalVentas / invoices : 0;
    const vpu = units ? totalVentas / units : 0;

    const selectedEnd = new Date(end + 'T12:00:00');
    const day = Math.max(1, selectedEnd.getDate());
    const projection = (totalVentas / day) * daysInMonth(selectedEnd);

    const serviceMap = {};
    registrosF.forEach(r => { const key = r.servicioDescripcion || r.descripcion || 'Sin servicio'; serviceMap[key] = (serviceMap[key] || 0) + safeNumber(r.valor || r.valorPagado); });
    const topServices = Object.entries(serviceMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const productUnits = {}, productProfit = {}, productSales = {}, clientSales = {};
    ventasF.forEach(v => {
      clientSales[v.clienteNombre || 'General'] = (clientSales[v.clienteNombre || 'General'] || 0) + safeNumber(v.valor || v.totalPagado);
      if (v.isAbono) return;
      (v.items || []).forEach(it => {
        const key = it.descripcion || 'Producto';
        productUnits[key] = (productUnits[key] || 0) + safeNumber(it.cantidad);
        productSales[key] = (productSales[key] || 0) + safeNumber(it.total);
        productProfit[key] = (productProfit[key] || 0) + ((safeNumber(it.pvpUnitario) - safeNumber(it.costoUnitario)) * safeNumber(it.cantidad));
      });
    });
    const invValue = inventario.reduce((s,i)=>s+safeNumber(i.stock)*safeNumber(i.costoUnitario),0);
    const invQty = inventario.reduce((s,i)=>s+safeNumber(i.stock),0);

    // [MEJORA #3 - INICIO]
    $('#dashboardRoot').innerHTML = `
      <div class="grid grid-4">
        ${metricCard('Ingresos por Servicios', ingresosServicios, 'concierge-bell')}
        ${metricCard('Total Ventas', totalVentas, 'trending-up')}
        ${metricCard('Total Compras', totalCompras, 'shopping-bag')}
        ${metricCard('Total Gastos', totalGastos, 'wallet')}
      </div>
      <div class="grid grid-4" style="margin-top:16px">
        ${metricCard('Utilidad Neta', utilidad, 'badge-dollar-sign')}
        ${metricCard('Valor inventario', invValue, 'boxes')}
        ${metricCard('Stock total', invQty, 'package')}
        ${metricCard('Proyección ventas', projection, 'chart-line')}
      </div>
      <div class="grid grid-3" style="margin-top:16px">
        <div class="card"><h3>Ventas vs Compras vs Gastos</h3><canvas id="barChart"></canvas></div>
        <div class="card"><h3>Formas de Pago</h3><canvas id="paymentChart"></canvas></div>
        <div class="card"><h3>Proyección vs Meta</h3><canvas id="projectionChart"></canvas></div>
      </div>
      <div class="grid grid-2" style="margin-top:16px">
        ${simpleTable('5 servicios más rentables', ['Servicio','Valor'], topServices.map(([k,v])=>[k,money(v)]))}
        ${simpleTable('Indicadores de venta', ['Indicador','Valor'], [['Unidades',units],['Ventas',money(totalVentas)],['Facturas',invoices],['UPT',upt.toFixed(2)],['VPT',money(vpt)],['VPU',money(vpu)]])}
        ${simpleTable('Top 5 productos más vendidos', ['Producto','Unidades'], Object.entries(productUnits).sort((a,b)=>b[1]-a[1]).slice(0,5))}
        ${simpleTable('Top 5 productos más rentables', ['Producto','Utilidad'], Object.entries(productProfit).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>[k,money(v)]))}
        ${simpleTable('Ventas por cliente', ['Cliente','Valor'], Object.entries(clientSales).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>[k,money(v)]))}
        ${simpleTable('Resumen de inventario', ['Indicador','Valor'], [['Valor total valorizado', money(invValue)], ['Cantidad total en stock', invQty]])}
      </div>`;
    // [MEJORA #3 - FIN]
    initIcons();
    renderCharts([totalVentas,totalCompras,totalGastos], sumPaymentsByMethod([...ventasF, ...registrosF]), projection, goal);
  };

  bindDateFilterGuard('dashboard', render);
  addUnsub(db.collection('ventas').onSnapshot(snap => { ventas = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('compras').onSnapshot(snap => { compras = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('gastos').onSnapshot(snap => { gastos = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('registros').onSnapshot(snap => { registros = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('inventario').onSnapshot(snap => { inventario = snap.docs.map(doc => ({id:doc.id,...doc.data()})); render(); }));
  addUnsub(db.collection('ajustes').doc('dashboard').onSnapshot(doc => { metaDoc = doc.exists ? doc.data() : { metaMensual:0 }; render(); }));
  addUnsub(db.collection(NEW_COLLECTIONS.payments).onSnapshot(snap => { paymentMap = paymentMapFromDocs(snap.docs); render(); }));
}

function metricCard(title, value, icon) {
  const display = typeof value === 'number' && !['Stock total'].includes(title) ? money(value) : escapeHtml(value);
  return `<div class="card metric-card"><div><div class="metric-title">${escapeHtml(title)}</div><div class="metric-value">${display}</div></div><div class="icon-bubble"><i data-lucide="${icon}"></i></div></div>`;
}

function simpleTable(title, headers, rows) {
  return `<div class="card"><h3>${escapeHtml(title)}</h3>${rows.length ? `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : emptyState('Sin datos en el rango seleccionado.')}</div>`;
}

/* ============================================================
   NUEVAS FUNCIONES: pagos independientes, configuración y facturas
   ============================================================ */
function paymentDocId(type, recordId) {
  return `${type}_${recordId}`;
}

function paymentMapFromDocs(docs) {
  const map = {};
  (docs || []).forEach(doc => { map[doc.id] = { id:doc.id, ...doc.data() }; });
  return map;
}

function getPaymentMeta(type, recordId, paymentMap={}) {
  if (!recordId) return null;
  return paymentMap[paymentDocId(type, recordId)] || null;
}

function paymentTextForRecord(record, type, paymentMap={}) {
  const meta = type === 'ventas'
    ? getPaymentMeta('factura', record.facturaId, paymentMap)
    : getPaymentMeta('registro', record.id, paymentMap);
  if (meta) {
    if (meta.estado !== 'confirmado') return 'Pago pendiente';
    if (Array.isArray(meta.pagos) && meta.pagos.length) {
      return meta.pagos.map(p => `${p.metodo}: ${money(p.monto)}`).join(' · ');
    }
    return meta.formaPago || 'Pago confirmado';
  }
  const legacyText=(record.pagos || []).map(p => `${p.metodo}: ${money(p.monto)}`).join(' · ') || record.formaPago || '';
  return legacyText || 'Pago pendiente';
}

function aggregatePaymentsByMethod(records, paymentMap={}, type='ventas') {
  const map = {};
  (records || []).forEach(record => {
    const meta = type === 'registros'
      ? getPaymentMeta('registro', record.id, paymentMap)
      : getPaymentMeta('factura', record.facturaId, paymentMap);
    let payments = null;
    if (meta) {
      if (meta.estado !== 'confirmado') return;
      payments = Array.isArray(meta.pagos) ? meta.pagos : [];
    } else {
      if (!record.formaPago && !(Array.isArray(record.pagos) && record.pagos.length)) return;
      payments = Array.isArray(record.pagos) && record.pagos.length
        ? record.pagos
        : [{ metodo:record.formaPago || 'Sin método', monto:safeNumber(record.valor || record.totalPagado || record.valorPagado) }];
    }
    payments.forEach(payment => {
      const method = payment.metodo || 'Sin método';
      map[method] = (map[method] || 0) + safeNumber(payment.monto);
    });
  });
  return map;
}

    document.body.appendChild(area);

}

function buildPaymentDraftFromModal() {
  const method1 = $('#paymentMethod1')?.value || '';
  const method2 = $('#paymentMethod2')?.value || '';
  const split = !!$('#paymentSplit')?.checked;
  const amount1 = safeNumber($('#paymentAmount1')?.value);
  const amount2 = split ? safeNumber($('#paymentAmount2')?.value) : 0;
  const validSelection = !!method1 && (!split || amount2<=0 || !!method2);
  const payments = validSelection ? getPaymentDistribution(method1, amount1, split, method2, amount2) : [];
  return { method1, method2, split, amount1, amount2, payments, validSelection };
}

async function openPaymentModal(options) {
  const {
    type, recordId, total=0, amount1=0, amount2=0, split=false,
    clientName='', documentNumber='', dateLabel=localDateTime(new Date()),
    items=[], serviceDescription='', roomName='', cedula='', phone='', guestCount=0,
    balance=Math.max(safeNumber(total)-safeNumber(amount1)-safeNumber(amount2),0),
    notes='', existingMeta=null, persistenceWarning=false
  } = options;
  if (!type || !recordId) {
    toast('No fue posible identificar el registro asociado al pago.', 'error');
    return;
  }
  const collection = db.collection(NEW_COLLECTIONS.payments);
  const docId = paymentDocId(type, recordId);
  let paymentMeta = existingMeta;
  try {
    if (!paymentMeta) {
      const snap = await collection.doc(docId).get();
      paymentMeta = snap.exists ? snap.data() : null;
    }
    if (!paymentMeta) {
      paymentMeta = {
        tipoRegistro:type, registroId:recordId,
        estado:'pendiente', formaPago:'', pagos:[],
        montoRecibido:safeNumber(amount1)+safeNumber(amount2),
        montoPrimero:safeNumber(amount1),montoSegundo:safeNumber(amount2),pagoDividido:!!split,
        saldoPendiente:safeNumber(balance), createdAt:serverNow(), updatedAt:serverNow()
      };
      await collection.doc(docId).set(paymentMeta, {merge:true});
    }
  } catch (err) {
    showError(err, 'No fue posible preparar el pago');
    return;
  }

  const metaPayments = Array.isArray(paymentMeta.pagos) ? paymentMeta.pagos : [];
  const defaultMethod1 = metaPayments[0]?.metodo || (paymentMeta.estado==='confirmado' ? (paymentMeta.formaPago||PAYMENT_METHODS[0]) : '');
  const defaultMethod2 = metaPayments[1]?.metodo || '';
  const defaultAmount1 = paymentMeta.montoPrimero !== undefined ? safeNumber(paymentMeta.montoPrimero) : (paymentMeta.montoRecibido !== undefined ? safeNumber(paymentMeta.montoRecibido) : safeNumber(amount1));
  const defaultAmount2 = paymentMeta.montoSegundo !== undefined ? safeNumber(paymentMeta.montoSegundo) : safeNumber(amount2);
  const defaultSplit = paymentMeta.pagoDividido === true || split || defaultAmount2 > 0;

  modal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><h3>Confirmar forma de pago</h3><p class="muted" style="margin:0">El registro ya está guardado. Confirma el método para completar la información de pago.</p></div>
      <button class="btn btn-soft btn-sm" id="closePaymentModal" type="button" aria-label="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <div class="payment-modal-summary">
      <div><span class="muted">Cliente</span><b>${escapeHtml(clientName || 'General')}</b></div>
      <div><span class="muted">Total</span><b>${money(total)}</b></div>
      <div><span class="muted">Recibido</span><b>${money(defaultAmount1 + defaultAmount2)}</b></div>
      <div><span class="muted">Saldo pendiente</span><b>${money(balance)}</b></div>
    </div>
    <div class="form-grid two">
      <div class="field"><label for="paymentMethod1">Forma de pago</label><select id="paymentMethod1"><option value="" ${!defaultMethod1?'selected':''}>Selecciona...</option>${PAYMENT_METHODS.map(p=>`<option ${p===defaultMethod1?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label for="paymentAmount1">Monto recibido</label><input id="paymentAmount1" type="number" min="0" step="0.01" value="${defaultAmount1}" readonly /></div>
      <div class="field full"><label class="pill" style="justify-content:flex-start"><input id="paymentSplit" type="checkbox" style="width:auto" ${defaultSplit?'checked':''} disabled /> Pago dividido en dos métodos</label></div>
      <div class="field payment-split-field ${defaultSplit?'':'hidden'}"><label for="paymentMethod2">Segundo método</label><select id="paymentMethod2"><option value="" ${!defaultMethod2?'selected':''}>Selecciona...</option>${PAYMENT_METHODS.map(p=>`<option ${p===defaultMethod2?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field payment-split-field ${defaultSplit?'':'hidden'}"><label for="paymentAmount2">Monto segundo método</label><input id="paymentAmount2" type="number" min="0" step="0.01" value="${defaultAmount2}" readonly /></div>
    </div>
    <div class="calendar-form-note" id="paymentStatusNote" style="margin-top:12px">${persistenceWarning?'El registro ya está guardado, pero Firestore no permitió guardar el estado pendiente. Revisa las reglas de acceso de las colecciones nuevas.':'Si cierras esta ventana sin confirmar, el registro permanecerá guardado con estado <b>Pago pendiente</b>. Podrás completar el pago desde el historial.'}</div>
    <div class="modal-actions">
      <button class="btn btn-soft" id="printPaymentInvoice" type="button"><i data-lucide="printer"></i> Imprimir factura</button>
      <button class="btn btn-primary" id="confirmPaymentMethod" type="button"><i data-lucide="check"></i> Confirmar forma de pago</button>
    </div>
  `);
  $('#modalRoot .modal')?.classList.add('calendar-modal');
  $('#closePaymentModal').addEventListener('click', closeModal);
  $('#modalRoot .modal-backdrop')?.addEventListener('click', ev => { if (ev.target.classList.contains('modal-backdrop')) closeModal(); });
  $('#paymentSplit').addEventListener('change', () => {
    $$('.payment-split-field').forEach(el => el.classList.toggle('hidden', !$('#paymentSplit').checked));
  });
  $('#printPaymentInvoice').addEventListener('click', () => {
    const draft = buildPaymentDraftFromModal();

      documentLabel:type==='factura'?'Factura':'Factura de servicio', documentNumber,
      recordId, dateLabel, items, serviceDescription, roomName, clientName, cedula, phone,
      guestCount, quantity:guestCount||1, unitValue:guestCount>0?safeNumber(total)/safeNumber(guestCount):safeNumber(total), total, amountReceived:draft.amount1+draft.amount2, balance,
      notes
    }, draft.validSelection ? { payments:draft.payments, formaPago:(draft.split && draft.amount2>0)?'Mixto':draft.method1 } : null);
  });
  $('#confirmPaymentMethod').addEventListener('click', async () => {
    const draft = buildPaymentDraftFromModal();
    if (!draft.method1) { toast('Selecciona una forma de pago.', 'error'); return; }
    if (draft.split && draft.amount2 > 0 && !draft.method2) { toast('Selecciona el segundo método de pago.', 'error'); return; }
    try {
      await collection.doc(docId).set({
        tipoRegistro:type, registroId:recordId,
        estado:'confirmado', formaPago:(draft.split && draft.amount2>0)?'Mixto':draft.method1,
        pagoDividido:draft.split && draft.amount2>0, pagos:draft.payments,
        montoRecibido:draft.amount1+draft.amount2, montoPrimero:draft.amount1,
        montoSegundo:draft.amount2, saldoPendiente:safeNumber(balance),
        confirmedAt:serverNow(), updatedAt:serverNow(), confirmadoPor:currentUser?.email || ''
      }, {merge:true});
      const statusNote=$('#paymentStatusNote');
      if(statusNote)statusNote.innerHTML='<b>Forma de pago confirmada.</b> Ya puedes imprimir la factura o cerrar esta ventana.';
      const confirmButton=$('#confirmPaymentMethod');
      if(confirmButton){confirmButton.disabled=true;confirmButton.innerHTML='<i data-lucide="check-check"></i> Pago confirmado';initIcons();}
      $('#paymentMethod1').disabled=true;
      if($('#paymentMethod2'))$('#paymentMethod2').disabled=true;
      toast('Forma de pago confirmada');
    } catch (err) { showError(err, 'No fue posible confirmar la forma de pago'); }
  });
}

function openPendingPaymentFromRecord(record, type, paymentMap={}) {
  const isInvoice = type === 'factura';
  const meta = getPaymentMeta(type, record.id, paymentMap);
  const amount1 = meta?.montoPrimero ?? meta?.montoRecibido ?? record.totalPagado ?? record.valorPagado ?? record.valor ?? 0;
  const amount2 = meta?.montoSegundo ?? 0;
  openPaymentModal({
    type, recordId:record.id, total:record.totalFactura ?? record.valorTotal ?? record.total ?? 0,
    amount1, amount2, split:meta?.pagoDividido ?? record.pagoDividido,
    clientName:record.clienteNombre || 'General',
    documentNumber:isInvoice ? (record.facturaNumero || '-') : (record.numeroRegistro || record.id),
    dateLabel:localDateTime(getDocDate(record) || new Date()),
    items:record.items || [], serviceDescription:record.servicioDescripcion || record.descripcion || '',
    roomName:record.habitacionNombre || '', cedula:record.cedula || '',
    guestCount:record.cantidadHuespedes || 0,
    balance:record.saldoPendiente ?? Math.max(safeNumber(record.totalFactura ?? record.valorTotal)-safeNumber(amount1)-safeNumber(amount2),0),
    existingMeta:meta
  });
}

/* ============================================================
   NUEVAS FUNCIONES: calendario hotelero de reservas
   ============================================================ */
function calendarReservationRange(reservation) {
  return { start:reservation.fechaEntrada, end:reservation.fechaSalida };
}

function getActiveRoomRange(room, guestRecords=[], guestDetails={}) {
  if (room?.estado !== 'ocupada') return null;
  if (!room.estadiaActiva) return { start:localDateInput(new Date()), end:null, name:'Habitación ocupada', active:true };
  const stay = room.estadiaActiva;
  const linkedRecord = guestRecords.find(record=>record.id===stay.registroId) || null;
  const linkedDetail = linkedRecord ? (guestDetails[linkedRecord.id] || {}) : {};
  const guestName = linkedRecord?.clienteNombre || stay.clienteNombre || 'Huésped actual';
  const guestCount = safeNumber(linkedDetail.cantidadHuespedes) || 1;
  const guestPhone = linkedDetail.telefono || '';
  const checkInDate = stay.checkIn?.toDate ? stay.checkIn.toDate() : (stay.checkIn ? new Date(stay.checkIn) : new Date());
  const exitDate = stay.expiresAt?.toDate ? stay.expiresAt.toDate() : (stay.expiresAt ? new Date(stay.expiresAt) : null);
  const start = localDateInput(checkInDate);
  if (!exitDate || Number.isNaN(exitDate.getTime())) return { start, end:null, name:guestName, people:guestCount, phone:guestPhone, active:true };
  let end = localDateInput(exitDate);
  if (end <= start) end = addDaysISO(start, 1);
  return { start, end, name:guestName, people:guestCount, phone:guestPhone, active:true, exitDate };
}

function reservationConflict(roomId, start, end, reservations, rooms, excludeId=null) {
  const room = rooms.find(r => r.id === roomId);
  const active = getActiveRoomRange(room);
  if (active) {
    const activeEnd = active.end || '9999-12-31';
    if (start < activeEnd && end > active.start) {
      return { name:active.name, start:active.start, end:active.end || 'Sin salida definida', kind:'ocupación actual' };
    }
  }
  const conflict = reservations.find(r => r.id !== excludeId && r.estado === 'reservada' && r.habitacionId === roomId && start < r.fechaSalida && end > r.fechaEntrada);
  return conflict ? { name:conflict.clienteNombre || 'Reserva', start:conflict.fechaEntrada, end:conflict.fechaSalida, kind:'reserva' } : null;
}

function renderCalendario() {
  let rooms = [];

        <span><i class="legend-dot" style="background:#fff;border:1px solid #cbd5e1"></i> Libre</span>
        <span><i class="legend-dot" style="background:#dbeafe;border:1px solid #93c5fd"></i> Reservada</span>
        <span><i class="legend-dot" style="background:#fee2e2;border:1px solid #fca5a5"></i> Ocupada</span>
        <span><i class="legend-dot" style="background:#e5e7eb;border:1px solid #cbd5e1"></i> Cancelada (historial)</span>
      </div>
      <div id="calendarBoard"></div>
    </div>
  `);

  const visibleReservations = () => reservations.filter(r => r.estado === 'reservada' && r.fechaSalida > calendarStart && r.fechaEntrada < addDaysISO(calendarStart, windowDays));
  const getRoomTodayState = room => {
    if (room.estado === 'ocupada') return 'ocupada';
    const today = localDateInput(new Date());
    if (reservations.some(r => r.estado === 'reservada' && r.habitacionId === room.id && r.fechaEntrada <= today && r.fechaSalida > today && !Object.values(guestDetails).some(detail=>detail.reservaId===r.id))) return 'reservada';
    return 'libre';
  };

  const renderSummary = () => {
    const today = localDateInput(new Date());
    const occupied = rooms.filter(r => r.estado === 'ocupada').length;
    const reservedRoomIds = new Set(reservations.filter(r => r.estado === 'reservada' && r.fechaEntrada <= today && r.fechaSalida > today && !Object.values(guestDetails).some(detail=>detail.reservaId===r.id) && !rooms.some(room => room.id === r.habitacionId && room.estado === 'ocupada')).map(r=>r.habitacionId));
    const reserved = reservedRoomIds.size;
    const arrivals = reservations.filter(r => r.estado === 'reservada' && r.fechaEntrada === today).length;
    const free = Math.max(rooms.length - occupied - reserved, 0);
    $('#calendarSummary').innerHTML = `
      <div class="card"><span class="muted mini">Habitaciones libres hoy</span><div class="metric-value">${free}</div></div>
      <div class="card"><span class="muted mini">Ocupadas hoy</span><div class="metric-value">${occupied}</div></div>
      <div class="card"><span class="muted mini">Reservadas hoy</span><div class="metric-value">${reserved}</div></div>
      <div class="card"><span class="muted mini">Llegadas previstas hoy</span><div class="metric-value">${arrivals}</div></div>`;
  };

  const renderBoard = () => {
    if (!$('#calendarBoard')) return;
    const today = localDateInput(new Date());
    const endWindow = addDaysISO(calendarStart, windowDays);
    const dates = Array.from({length:windowDays}, (_,i)=>addDaysISO(calendarStart,i));
    const query = normalizeSearchText($('#calendarSearch').value || '');
    const typeFilter = $('#calendarTypeFilter').value;
    const statusFilter = $('#calendarStatusFilter').value;
    const filteredRooms = rooms.filter(room => {
      const type = room.tipoHabitacion || room.tipo || 'Sin tipo';
      return (!typeFilter || type === typeFilter) && (!statusFilter || getRoomTodayState(room) === statusFilter);
    });
    const cols = `var(--calendar-room-col,176px) repeat(${windowDays},var(--calendar-day-col,94px))`;
    const header = `<div class="calendar-grid" style="grid-template-columns:${cols}">
      <div class="cal-corner">Habitación</div>
      ${dates.map((date,idx)=>{
        const weekday = new Intl.DateTimeFormat('es-CO',{weekday:'short',timeZone:'America/Bogota'}).format(dateFromISO(date)).replace('.','');
        const month = new Intl.DateTimeFormat('es-CO',{month:'short',timeZone:'America/Bogota'}).format(dateFromISO(date)).replace('.','');
        const previousMonth = idx ? dates[idx-1].slice(5,7) : '';
        const showMonth = idx===0 || previousMonth !== date.slice(5,7);
        const weekend = [0,6].includes(dateFromISO(date).getUTCDay());
        return `<div class="cal-date-head ${date===today?'today':''} ${weekend?'weekend':''}"><span>${escapeHtml(weekday)}</span><strong>${Number(date.slice(8,10))}</strong><small>${showMonth?escapeHtml(month):'&nbsp;'}</small></div>`;
      }).join('')}
      ${filteredRooms.map(room=>{
        const roomType = room.tipoHabitacion || room.tipo || 'Sin tipo';
        const activeRange = getActiveRoomRange(room,guestRegistrations,guestDetails);
        const activeStay = activeRange && activeRange.start < endWindow && (!activeRange.end || activeRange.end > calendarStart);
        const bars = [];
        if (activeStay) {
          const barStart = activeRange.start < calendarStart ? calendarStart : activeRange.start;
          const actualEnd = activeRange.end || endWindow;
          // Se representa visualmente el día de salida; la validación de cruces conserva la salida exclusiva.
          const visualEnd = actualEnd;
          const barEnd = visualEnd > endWindow ? endWindow : visualEnd;
          const left = Math.max(0,diffDaysISO(calendarStart,barStart));
          const span = Math.max(1,Math.min(windowDays-left,diffDaysISO(barStart,barEnd)));
          bars.push(`<button class="cal-reservation occupied ${activeRange.start<calendarStart?'continues':''}" style="left:calc(${left} * var(--calendar-day-col,94px) + 4px);width:calc(${span} * var(--calendar-day-col,94px) - 8px)" type="button" title="${escapeHtml(activeRange.name)} · ${escapeHtml(activeRange.phone||'Sin teléfono')} · ${activeRange.people||1} personas · Ocupada" data-active-room="${room.id}"><span class="cal-bar-text">${escapeHtml(activeRange.name)}</span><span class="cal-bar-people">${activeRange.people||1} pers.</span></button>`);
        }
        reservations.filter(r=>r.habitacionId===room.id && r.estado==='reservada' && r.fechaSalida>calendarStart && r.fechaEntrada<endWindow && !Object.values(guestDetails).some(detail=>detail.reservaId===r.id)).forEach(r=>{
          const barStart = r.fechaEntrada < calendarStart ? calendarStart : r.fechaEntrada;
          const barEnd = r.fechaSalida > endWindow ? endWindow : r.fechaSalida;
          const left = Math.max(0,diffDaysISO(calendarStart,barStart));
          const span = Math.max(1,Math.min(windowDays-left,diffDaysISO(barStart,barEnd)));
          const haystack = normalizeSearchText(`${r.clienteNombre||''} ${r.cedula||''} ${r.telefono||''}`);
          const highlighted = query && haystack.includes(query);
          const title = `${r.clienteNombre||'Sin nombre'} · ${r.telefono||'Sin teléfono'} · ${r.fechaEntrada} a ${r.fechaSalida} · ${r.cantidadPersonas||1} personas · Saldo ${money(r.saldoPendiente||0)}`;
          bars.push(`<button class="cal-reservation reserved ${r.fechaEntrada<calendarStart?'continues':''} ${highlighted?'cal-highlight':''}" style="left:calc(${left} * var(--calendar-day-col,94px) + 4px);width:calc(${span} * var(--calendar-day-col,94px) - 8px)" type="button" title="${escapeHtml(title)}" data-reservation-id="${r.id}"><span class="cal-bar-text">${escapeHtml(r.clienteNombre||'Reserva')}</span><span class="cal-bar-people">${safeNumber(r.cantidadPersonas)||1} pers.</span></button>`);
        });
        const cells = dates.map(date=>`<div class="cal-cell ${date===today?'today':''} ${[0,6].includes(dateFromISO(date).getUTCDay())?'weekend':''}" data-calendar-cell data-room-id="${room.id}" data-date="${date}"></div>`).join('');
        return `<div class="cal-room-row" style="display:contents"><div class="cal-room-label"><strong>${escapeHtml(room.nombre||'Habitación')}</strong><small>${escapeHtml(roomType)}</small></div><div class="cal-days-row" data-days-room="${room.id}" style="grid-column:span ${windowDays};grid-template-columns:repeat(${windowDays},var(--calendar-day-col,94px))">${cells}${bars.join('')}</div></div>`;
      }).join('')}
    </div>`;
    $('#calendarBoard').innerHTML = filteredRooms.length
      ? `<div class="calendar-scroll"><div style="min-width:max-content">${header}</div></div>`
      : `<div class="calendar-scroll"><div class="calendar-empty">${rooms.length?'No hay habitaciones que coincidan con los filtros.':'Crea habitaciones en la sección Habitaciones para comenzar a reservar.'}</div></div>`;

    $$('[data-calendar-cell]').forEach(cell => {
      cell.addEventListener('click', () => {
        if (suppressCalendarClick) { suppressCalendarClick=false; return; }
        const room = rooms.find(r=>r.id===cell.dataset.roomId);
        if (!room) return;
        const date = cell.dataset.date;
        openCalendarReservationModal({ room, start:date, end:addDaysISO(date,1) });
      });
      cell.addEventListener('pointerdown', ev => {
        if (ev.pointerType==='mouse' && ev.button!==0) return;
        dragState = { roomId:cell.dataset.roomId, start:cell.dataset.date, end:cell.dataset.date, moved:false };
      });
      cell.addEventListener('pointerenter', () => {
        if (dragState && dragState.roomId===cell.dataset.roomId) {
          dragState.end=cell.dataset.date;
          dragState.moved = dragState.start !== dragState.end;
          const start = dragState.start < dragState.end ? dragState.start : dragState.end;
          const end = dragState.start < dragState.end ? dragState.end : dragState.start;
          $$('[data-calendar-cell]').forEach(item=>item.classList.toggle('selected', item.dataset.roomId===dragState.roomId && item.dataset.date>=start && item.dataset.date<=end));
        }
      });
    });
    const scroll = $('.calendar-scroll');
    scroll?.addEventListener('pointerup', ev => {
      if (!dragState) return;
      const state = dragState;
      dragState = null;
      $$('[data-calendar-cell]').forEach(item=>item.classList.remove('selected'));
      if (!state.moved) return;
      const target = document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-calendar-cell]');
      const endDate = target && target.dataset.roomId===state.roomId ? target.dataset.date : state.end;
      const first = state.start < endDate ? state.start : endDate;
      const last = state.start < endDate ? endDate : state.start;
      suppressCalendarClick = true;
      const room = rooms.find(r=>r.id===state.roomId);
      if (room) openCalendarReservationModal({ room, start:first, end:addDaysISO(last,1) });
      setTimeout(()=>{ suppressCalendarClick=false; },250);
    });
    $$('[data-reservation-id]').forEach(btn=>btn.addEventListener('click',()=>{
      const reservation = reservations.find(r=>r.id===btn.dataset.reservationId);
      if (reservation) openCalendarReservationDetail(reservation);
    }));
    $$('[data-active-room]').forEach(btn=>btn.addEventListener('click',()=>{
      const room=rooms.find(r=>r.id===btn.dataset.activeRoom);
      if(room) openRoomPanel(room);
    }));
    $$('.cal-highlight').forEach(el=>{ el.style.outline='2px solid var(--warning)'; el.style.outlineOffset='1px'; });
    initIcons();
  };

  const render = () => { renderSummary(); renderBoard(); };
  const refreshDateBounds = () => {
    const today = localDateInput(new Date());
    $('#calendarDate').min = today;
    if (calendarStart < today) calendarStart = today;
    $('#calendarDate').value = calendarStart;
    $('#calendarPrev').disabled = addDaysISO(calendarStart,-7) < today;
    render();
  };

  $('#calendarToday').addEventListener('click',()=>{calendarStart=localDateInput(new Date());refreshDateBounds();});
  $('#calendarPrev').addEventListener('click',()=>{calendarStart=addDaysISO(calendarStart,-7);refreshDateBounds();});
  $('#calendarNext').addEventListener('click',()=>{calendarStart=addDaysISO(calendarStart,7);refreshDateBounds();});
  $('#calendarDate').addEventListener('change',()=>{
    const today=localDateInput(new Date());

  $('#calendarCancelledHistory').addEventListener('click',()=>openCancelledReservationsHistory(reservations));

  addUnsub(db.collection('habitaciones').onSnapshot(snap=>{
    rooms=snap.docs.map(doc=>({id:doc.id,...doc.data()})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'',undefined,{numeric:true}));
    const types=[...new Set(rooms.map(r=>r.tipoHabitacion||r.tipo||'Sin tipo'))].sort();
    const current=$('#calendarTypeFilter').value;
    $('#calendarTypeFilter').innerHTML='<option value="">Todos los tipos</option>'+types.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    if(types.includes(current)) $('#calendarTypeFilter').value=current;
    render();
  },err=>showError(err,'No fue posible cargar las habitaciones')));
  addUnsub(db.collection('servicios').onSnapshot(snap=>{services=snap.docs.map(doc=>({id:doc.id,...doc.data()})).filter(s=>s.requiereHabitacion!==false); }));
  addUnsub(db.collection(NEW_COLLECTIONS.reservations).onSnapshot(snap=>{reservations=snap.docs.map(doc=>({id:doc.id,...doc.data()}));render();},err=>showError(err,'No fue posible cargar las reservas')));
  // Lectura únicamente: el calendario usa los registros actuales para identificar al huésped alojado.
  addUnsub(db.collection('registros').onSnapshot(snap=>{guestRegistrations=snap.docs.map(doc=>({id:doc.id,...doc.data()}));render();},err=>showError(err,'No fue posible consultar los registros de huéspedes')));
  addUnsub(db.collection(NEW_COLLECTIONS.guestDetails).onSnapshot(snap=>{guestDetails=paymentMapFromDocs(snap.docs);render();},err=>showError(err,'No fue posible consultar los detalles de huéspedes')));
  let lastToday=localDateInput(new Date());
  activeIntervals.push(setInterval(()=>{const today=localDateInput(new Date());if(today!==lastToday){lastToday=today;calendarStart=today;refreshDateBounds();}},60000));
  refreshDateBounds();

  async function openCalendarReservationModal({room,start,end,reservation=null}) {
    const today=localDateInput(new Date());
    const editing=!!reservation;
    const source=reservation||{};
    const serviceOptions=services.map(s=>`<option value="${s.id}" ${s.id===(source.servicioId||'')?'selected':''}>${escapeHtml(s.descripcion)} · ${money(s.valor)}</option>`).join('');

      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3>${editing?'Editar reserva':'Nueva reserva'}</h3><p class="muted" style="margin:0">Habitación ${escapeHtml(room.nombre)}</p></div><button class="btn btn-soft btn-sm" id="closeCalendarReservation" type="button"><i data-lucide="x"></i></button></div>
      <div class="form-grid two" style="margin-top:16px">
        <div class="field"><label>Habitación</label><input value="${escapeHtml(room.nombre)}" readonly /></div>

        <div class="field"><label>Teléfono</label><input id="reservationPhone" type="tel" value="${escapeHtml(source.telefono||'')}" /></div>

        <div class="field"><label>Valor total</label><input id="reservationTotal" type="number" min="0" step="0.01" value="${source.valorTotal??''}" /></div>
        <div class="field"><label>Abono / anticipo</label><input id="reservationDeposit" type="number" min="0" step="0.01" value="${source.abono??0}" /></div>
        <div class="field"><label>Saldo pendiente</label><input id="reservationBalance" readonly /></div>

      </div>

    `);
    $('#modalRoot .modal')?.classList.add('calendar-modal');
    const serviceSelect=$('#reservationService');
    const serviceSelected=()=>services.find(s=>s.id===serviceSelect.value);
    const updateNights=()=>{
      const n=diffDaysISO($('#reservationStart').value,$('#reservationEnd').value);
      $('#reservationNights').value=Number.isFinite(n)&&n>0?`${n} ${n===1?'noche':'noches'}`:'—';
    };
    const updateBalance=()=>{
      const total=parseMoney($('#reservationTotal').value);
      const deposit=parseMoney($('#reservationDeposit').value);
      $('#reservationBalance').value=money(Math.max(total-deposit,0));
    };
    serviceSelect.addEventListener('change',()=>{
      const service=serviceSelected();
      if(service && !$('#reservationTotal').dataset.edited) $('#reservationTotal').value=safeNumber(service.valor);
      updateBalance();
    });
    $('#reservationTotal').addEventListener('input',()=>{$('#reservationTotal').dataset.edited='1';updateBalance();});
    $('#reservationDeposit').addEventListener('input',updateBalance);
    $('#reservationStart').addEventListener('change',updateNights);
    $('#reservationEnd').addEventListener('change',updateNights);
    $('#closeCalendarReservation').addEventListener('click',closeModal);
    $('#cancelCalendarReservation').addEventListener('click',closeModal);
    $('#modalRoot .modal-backdrop')?.addEventListener('click',ev=>{if(ev.target.classList.contains('modal-backdrop'))closeModal();});
    const selectedService=serviceSelected();
    if(!editing && selectedService && !$('#reservationTotal').value) $('#reservationTotal').value=safeNumber(selectedService.valor);
    updateNights();updateBalance();
    $('#saveCalendarReservation').addEventListener('click',async()=>{
      const fechaEntrada=$('#reservationStart').value;
      const fechaSalida=$('#reservationEnd').value;
      const servicio=serviceSelected();
      const clienteNombre=$('#reservationGuest').value.trim();
      const cedula=$('#reservationCedula').value.trim();
      const telefono=$('#reservationPhone').value.trim();
      const cantidadPersonas=Math.max(1,Math.floor(safeNumber($('#reservationPeople').value)));
      const valorTotal=parseMoney($('#reservationTotal').value);
      const abono=parseMoney($('#reservationDeposit').value);
      if(!fechaEntrada||!fechaSalida||!servicio||!clienteNombre||!cantidadPersonas||valorTotal<=0){toast('Completa habitación, fechas, servicio, huésped y cantidad de personas.','error');return;}
      if(!editing && fechaEntrada<today){toast('La fecha de entrada no puede ser anterior a hoy.','error');return;}
      if(fechaSalida<=fechaEntrada){toast('La fecha de salida debe ser posterior a la entrada.','error');return;}
      if(abono<0||abono>valorTotal){toast('El abono no puede ser negativo ni superar el valor total.','error');return;}
      const conflict=reservationConflict(room.id,fechaEntrada,fechaSalida,reservations,rooms,reservation?.id||null);
      if(conflict){toast(`Cruce con ${conflict.kind}: ${conflict.name} (${conflict.start} a ${conflict.end}).`,'error');return;}
      const data={
        habitacionId:room.id,habitacionNombre:room.nombre,
        fechaEntrada,fechaSalida,servicioId:servicio.id,servicioDescripcion:servicio.descripcion,
        clienteNombre,cedula,telefono,cantidadPersonas,valorTotal,abono,
        saldoPendiente:Math.max(valorTotal-abono,0),observaciones:$('#reservationNotes').value.trim(),
        estado:'reservada',updatedAt:serverNow(),actualizadoPor:currentUser?.email||''
      };
      try{
        if(editing) await db.collection(NEW_COLLECTIONS.reservations).doc(reservation.id).set(data,{merge:true});
        else await db.collection(NEW_COLLECTIONS.reservations).add({...data,createdAt:serverNow(),creadoPor:currentUser?.email||''});
        closeModal();toast(editing?'Reserva actualizada':'Reserva guardada');
      }catch(err){showError(err,'No fue posible guardar la reserva');}
    });
  }

  function openCalendarReservationDetail(reservation) {
    const room=rooms.find(r=>r.id===reservation.habitacionId);
    modal(`
      <div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${escapeHtml(reservation.clienteNombre||'Reserva')}</h3><p class="muted" style="margin:0">Habitación ${escapeHtml(reservation.habitacionNombre||room?.nombre||'-')}</p></div><button class="btn btn-soft btn-sm" id="closeReservationDetail" type="button"><i data-lucide="x"></i></button></div>
      <div class="payment-modal-summary" style="margin-top:16px">
        <div><span class="muted">Entrada</span><b>${formatISODate(reservation.fechaEntrada,{day:'numeric',month:'long',year:'numeric'})}</b></div>
        <div><span class="muted">Salida</span><b>${formatISODate(reservation.fechaSalida,{day:'numeric',month:'long',year:'numeric'})}</b></div>
        <div><span class="muted">Servicio</span><b>${escapeHtml(reservation.servicioDescripcion||'-')}</b></div>
        <div><span class="muted">Teléfono</span><b>${escapeHtml(reservation.telefono||'-')}</b></div>
        <div><span class="muted">Cédula</span><b>${escapeHtml(reservation.cedula||'-')}</b></div>
        <div><span class="muted">Personas</span><b>${safeNumber(reservation.cantidadPersonas)||1}</b></div>
        <div><span class="muted">Valor total</span><b>${money(reservation.valorTotal)}</b></div>
        <div><span class="muted">Abono</span><b>${money(reservation.abono)}</b></div>
        <div><span class="muted">Saldo pendiente</span><b>${money(reservation.saldoPendiente)}</b></div>
        <div><span class="muted">Observaciones</span><b>${escapeHtml(reservation.observaciones||'-')}</b></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-soft" id="closeReservationDetailBottom" type="button">Cerrar</button>
        <button class="btn btn-warning" id="editReservation" type="button"><i data-lucide="pencil"></i> Editar</button>
        <button class="btn btn-danger" id="cancelReservation" type="button"><i data-lucide="ban"></i> Cancelar reserva</button>
        <button class="btn btn-primary" id="registerReservationArrival" type="button"><i data-lucide="log-in"></i> Registrar llegada</button>
      </div>
    `);
    $('#closeReservationDetail').addEventListener('click',closeModal);
    $('#closeReservationDetailBottom').addEventListener('click',closeModal);
    $('#editReservation').addEventListener('click',()=>{closeModal();if(room)openCalendarReservationModal({room,start:reservation.fechaEntrada,end:reservation.fechaSalida,reservation});});
    $('#cancelReservation').addEventListener('click',async()=>{
      if(!confirm(`¿Cancelar la reserva de ${reservation.clienteNombre||'este huésped'}?`))return;
      try{await db.collection(NEW_COLLECTIONS.reservations).doc(reservation.id).set({estado:'cancelada',cancelledAt:serverNow(),cancelledBy:currentUser?.email||'',updatedAt:serverNow()},{merge:true});closeModal();toast('Reserva cancelada. Se conserva en el historial.');}
      catch(err){showError(err,'No fue posible cancelar la reserva');}
    });
    $('#registerReservationArrival').addEventListener('click',()=>{
      calendarArrivalDraft={reservationId:reservation.id,roomId:reservation.habitacionId,serviceId:reservation.servicioId,clienteNombre:reservation.clienteNombre,cedula:reservation.cedula,telefono:reservation.telefono,cantidadPersonas:reservation.cantidadPersonas,valorTotal:reservation.valorTotal,abono:reservation.abono};
      closeModal();navigate('registro-huespedes');
      toast('Datos de la reserva cargados. Confirma el registro de llegada.');
    });
  }

  function openCancelledReservationsHistory(allReservations) {
    const cancelled=allReservations.filter(r=>r.estado==='cancelada').sort((a,b)=>(b.fechaEntrada||'').localeCompare(a.fechaEntrada||''));
    modal(`<div style="display:flex;justify-content:space-between;gap:12px"><div><h3>Historial de reservas canceladas</h3><p class="muted" style="margin:0">Las reservas canceladas no ocupan espacio en el calendario.</p></div><button class="btn btn-soft btn-sm" id="closeCancelledHistory" type="button"><i data-lucide="x"></i></button></div>
      ${cancelled.length?`<div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Huésped</th><th>Habitación</th><th>Entrada</th><th>Salida</th><th>Teléfono</th></tr></thead><tbody>${cancelled.map(r=>`<tr><td>${escapeHtml(r.clienteNombre||'-')}</td><td>${escapeHtml(r.habitacionNombre||'-')}</td><td>${escapeHtml(r.fechaEntrada||'-')}</td><td>${escapeHtml(r.fechaSalida||'-')}</td><td>${escapeHtml(r.telefono||'-')}</td></tr>`).join('')}</tbody></table></div>`:emptyState('Todavía no hay reservas canceladas.')}
      <div class="modal-actions"><button class="btn btn-soft" id="closeCancelledHistoryBottom" type="button">Cerrar</button></div>`);
    $('#closeCancelledHistory').addEventListener('click',closeModal);
    $('#closeCancelledHistoryBottom').addEventListener('click',closeModal);
  }
}

};
